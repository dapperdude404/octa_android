plugins { id 'com.android.application' }
android {
    namespace 'com.dapperdude404.octo'
    compileSdk 36
    defaultConfig {
        applicationId "com.dapperdude404.octo"
        minSdk 26          // Android 8.0
        targetSdk 36
        versionCode 1
        versionName "1.0.0"
        // Pure Java app: no native code, so it runs on arm64-v8a, armeabi-v7a and x86 devices.
    }
    buildTypes { release { minifyEnabled false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
}
